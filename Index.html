<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radish Games 🌿</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-envio { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: left; }
        .form-envio input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border-radius: 4px; border: none; box-sizing: border-box; background: #2d2d2d; color: #fff; }
        .form-envio button { background: #ff4757; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .grid-jogos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card-jogo { background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        iframe { width: 100%; height: 250px; border: none; border-radius: 4px; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Radish Games 🌿🕹️</h1>
        <p>Jogue e publique seus próprios games via Embed!</p>

        <!-- Formulário para envio de novos jogos -->
        <div class="form-envio">
            <h3>Publicar seu Game</h3>
            <label>Nome do Jogo:</label>
            <input type="text" id="gameTitulo" placeholder="Ex: Meu Jogo Super Legal">
            
            <label>URL do Embed (Iframe):</label>
            <input type="url" id="gameUrl" placeholder="Ex: https://mit.edu">
            
            <label>Seu Nome/Nick:</label>
            <input type="text" id="gameAutor" placeholder="Ex: Error404">
            
            <button onclick="enviarJogo()">Publicar Game</button>
        </div>

        <h2>Jogos Disponíveis</h2>
        <div class="grid-jogos" id="listaJogos">Carregando games...</div>
    </div>

    <script>
        // Configuração gerada com o ID real do seu projeto
        const PROJETO_ID = "radish-1c9ed";
        const API_URL = `https://googleapis.com{PROJETO_ID}/databases/(default)/documents/jogos`;

        // 1. CARREGAR OS JOGOS DO SEU FIRESTORE
        function carregarJogos() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    const listaDiv = document.getElementById('listaJogos');
                    listaDiv.innerHTML = '';

                    if (!data.documents || data.documents.length === 0) {
                        listaDiv.innerHTML = '<p>Nenhum jogo publicado ainda. Seja o primeiro!</p>';
                        return;
                    }

                    data.documents.forEach(doc => {
                        const campos = doc.fields;
                        
                        // Garante que o documento tenha os campos certos antes de exibir
                        if (campos && campos.titulo && campos.embedUrl) {
                            const titulo = campos.titulo.stringValue;
                            const embedUrl = campos.embedUrl.stringValue;
                            const autor = campos.autor ? campos.autor.stringValue : 'Anônimo';

                            listaDiv.innerHTML += `
                                <div class="card-jogo">
                                    <h3>${titulo}</h3>
                                    <iframe src="${embedUrl}" allowfullscreen></iframe>
                                    <p><small>Enviado por: ${autor}</small></p>
                                </div>
                            `;
                        }
                    });
                })
                .catch(err => {
                    document.getElementById('listaJogos').innerText = "Erro ao carregar os jogos.";
                    console.error(err);
                });
        }

        // 2. ENVIAR UM NOVO JOGO PARA O SEU FIRESTORE
        function enviarJogo() {
            const titulo = document.getElementById('gameTitulo').value;
            const embedUrl = document.getElementById('gameUrl').value;
            const autor = document.getElementById('gameAutor').value;

            if(!titulo || !embedUrl) {
                alert("Por favor, preencha o título e a URL do embed!");
                return;
            }

            // Estrutura exata exigida pelo Firestore no formato REST
            const payload = {
                fields: {
                    titulo: { stringValue: titulo },
                    embedUrl: { stringValue: embedUrl },
                    autor: { stringValue: autor || "Anônimo" }
                }
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if(res.ok) {
                    alert("Jogo publicado com sucesso!");
                    document.getElementById('gameTitulo').value = '';
                    document.getElementById('gameUrl').value = '';
                    document.getElementById('gameAutor').value = '';
                    carregarJogos(); // Atualiza a lista automaticamente
                } else {
                    alert("Erro ao publicar. Certifique-se de que salvou aquelas Regras (Rules) sem data de validade no Firebase!");
                }
            })
            .catch(err => {
                alert("Erro na conexão com o banco de dados.");
                console.error(err);
            });
        }

        // Inicia buscando os jogos salvos assim que a página abre
        carregarJogos();
    </script>
</body>
</html>

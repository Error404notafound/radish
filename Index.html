<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radish Games 🌿</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-envio { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: left; }
        .form-envio input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border-radius: 4px; border: none; box-sizing: border-box; background: #2d2d2d; color: #fff; }
        .form-envio button { background: #ff4757; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .grid-jogos { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card-jogo { background: #1e1e1e; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        iframe { width: 100%; height: 250px; border: none; border-radius: 4px; background: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Radish Games 🌿🕹️</h1>
        <p>Jogue e publique seus próprios games via Embed!</p>

        <!-- Formulário para envio de novos jogos -->
        <div class="form-envio">
            <h3>Publicar seu Game</h3>
            <label>Nome do Jogo:</label>
            <input type="text" id="gameTitulo" placeholder="Ex: Meu Jogo Super Legal">
            
            <label>URL do Embed (Iframe):</label>
            <input type="url" id="gameUrl" placeholder="Ex: https://mit.edu">
            
            <label>Seu Nome/Nick:</label>
            <input type="text" id="gameAutor" placeholder="Ex: Error404">
            
            <button id="btnEnviar">Publicar Game</button>
        </div>

        <h2>Jogos Disponíveis</h2>
        <div class="grid-jogos" id="listaJogos">Carregando games do Firebase...</div>
    </div>

    <!-- Script do tipo module para permitir o uso de 'import' do SDK oficial do Firebase -->
    <script type="module">
        // Importando as funções oficiais direto da CDN do Firebase (Versão Modular v10)
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, collection, addDoc, getDocs } from "https://gstatic.com";

        // A SUA CONFIGURAÇÃO OFICIAL DA API
        const firebaseConfig = {
          apiKey: "AIzaSyDDVplbkVC4YepZDJOzFG9bqgzz1tBAOq8",
          authDomain: "radish-1c9ed.firebaseapp.com",
          projectId: "radish-1c9ed",
          storageBucket: "radish-1c9ed.firebasestorage.app",
          messagingSenderId: "183804088219",
          appId: "1:183804088219:web:36b67db3f3d85b63dc5b3e"
        };

        // Inicializando o Firebase e o Banco de Dados Firestore Lite
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referência para a coleção chamada 'jogos'
        const jogosCollection = collection(db, "jogos");

        // 1. FUNÇÃO OFICIAL DO SDK PARA BUSCAR OS JOGOS SALVOS
        async function carregarJogos() {
            const listaDiv = document.getElementById('listaJogos');
            try {
                const querySnapshot = await getDocs(jogosCollection);
                listaDiv.innerHTML = '';

                if (querySnapshot.empty) {
                    listaDiv.innerHTML = '<p>Nenhum jogo publicado ainda. Seja o primeiro!</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const dados = doc.data();
                    const titulo = dados.titulo;
                    const embedUrl = dados.embedUrl;
                    const autor = dados.autor || 'Anônimo';

                    listaDiv.innerHTML += `
                        <div class="card-jogo">
                            <h3>${titulo}</h3>
                            <iframe src="${embedUrl}" allowfullscreen></iframe>
                            <p><small>Enviado por: ${autor}</small></p>
                        </div>
                    `;
                });
            } catch (error) {
                listaDiv.innerText = "Erro ao carregar os jogos do Firestore.";
                console.error("Erro no Firebase:", error);
            }
        }

        // 2. FUNÇÃO OFICIAL DO SDK PARA ADICIONAR UM NOVO JOGO
        async function enviarJogo() {
            const titulo = document.getElementById('gameTitulo').value;
            const embedUrl = document.getElementById('gameUrl').value;
            const autor = document.getElementById('gameAutor').value;

            if (!titulo || !embedUrl) {
                alert("Por favor, preencha o título e a URL do embed!");
                return;
            }

            try {
                // Adicionando o documento direto na coleção usando as funções do SDK
                await addDoc(jogosCollection, {
                    titulo: titulo,
                    embedUrl: embedUrl,
                    autor: autor || "Anônimo",
                    dataCriacao: new Date()
                });

                alert("Jogo publicado com sucesso!");
                
                // Limpa o formulário e atualiza a tela
                document.getElementById('gameTitulo').value = '';
                document.getElementById('gameUrl').value = '';
                document.getElementById('gameAutor').value = '';
                carregarJogos();
            } catch (error) {
                alert("Erro ao publicar jogo. Verifique suas regras do banco.");
                console.error("Erro ao salvar:", error);
            }
        }

        // Vincula a função ao clique do botão
        document.getElementById('btnEnviar').addEventListener('click', enviarJogo);

        // Executa a busca assim que o site carrega
        carregarJogos();
    </script>
</body>
</html>
